<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<title>勉強タイマー 試作</title>
<style>
:root{--bg:#0b0d12;--fg:#e8ecf4;--dim:#8a93a6;--line:#232a38;--card:#141824;--blue:#4da3ff;--purple:#b07cff;--gold:#ffc93c;--green:#3ddc97;--btn:#2f6fed;--btnd:#1f4fb5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;font-size:17px;line-height:1.6;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
.scr{position:fixed;inset:0;display:none;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch}
.scr.on{display:flex}
b{font-weight:700}
.up{color:var(--green)}
/* ボタン */
.start{display:block;width:100%;min-height:56px;border-radius:16px;background:var(--btn);color:#fff;font-size:19px;font-weight:700;box-shadow:0 4px 0 var(--btnd);transition:transform .06s,box-shadow .06s}
.start:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btnd)}
.pill{min-height:44px;padding:0 16px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:600}
.pill:active,.ghost:active{transform:scale(.96)}
.pill.has{border-color:var(--gold);color:var(--gold)}
.ghost{min-height:44px;padding:0 18px;border-radius:14px;border:1px solid var(--line);color:var(--dim);font-size:16px}
/* ホーム */
.lvbar{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
.lvbadge{width:52px;height:52px;border-radius:14px;background:linear-gradient(160deg,#2b3550,#161b29);border:1px solid #33405e;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.lvbadge b{font-size:22px}.lvbadge small{font-size:11px;color:var(--dim);margin-top:3px}
.lvcol{flex:1}
.lvtrack{height:10px;border-radius:6px;background:#1c2232;overflow:hidden}
.lvfill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#3d7bff,#7fb3ff)}
.lvnext{font-size:14px;color:var(--dim);margin-top:5px}
.today{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px 14px}
.tlabel{font-size:14px;color:var(--dim)}
.bignum{font-weight:700;line-height:1.1;letter-spacing:.01em}
.bignum b{font-size:46px}.bignum i{font-style:normal;font-size:18px;color:var(--dim);margin:0 4px 0 2px}
.tgoal{font-size:16px;margin-top:6px}
.dbar{position:relative;height:8px;border-radius:5px;background:#1c2232;margin:10px 0 12px}
.dfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;background:var(--blue)}
.dline{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;opacity:.8}
.week{display:flex;justify-content:space-between;margin:4px 2px 8px}
.wd{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--dim);gap:3px}
.wd i{width:26px;height:26px;border-radius:50%;border:2px solid #2a3245;display:block}
.wd.done i{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px #ffc93c66}
.wd.now i{border-color:#fff}
.streak{font-size:15px;display:flex;align-items:center;gap:6px}
.streak svg{width:16px;height:18px}
.row2{display:flex;gap:10px;margin:16px 0}
.grow{flex:1}
.startwrap{margin-top:auto;padding-top:12px}
.subj{display:block;margin:0 auto 10px;min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);font-size:16px;color:var(--fg)}
.foot{display:flex;justify-content:center;margin-top:10px}
.foot button{font-size:13px;color:var(--dim);min-height:36px;padding:0 10px}
/* タイマー中 */
#timer{--tfg:#e8ecf4;--tac:#4da3ff;background:#0b0d12;color:var(--tfg);align-items:center;transition:background .6s}
.tsubj{margin-top:6vh;font-size:16px;opacity:.6}
.clock{margin-top:3vh;font-weight:300;line-height:1;white-space:nowrap}
.clock .dg{display:inline-block;font-size:84px}
.clock i{font-style:normal;font-size:22px;opacity:.6;margin:0 6px 0 2px;font-weight:400}
.dg.roll{animation:roll .5s cubic-bezier(.2,.8,.3,1)}
@keyframes roll{from{transform:translateY(45%);opacity:0}to{transform:none;opacity:1}}
.tcap{font-size:14px;opacity:.5;margin-top:8px}
.tdiff{margin-top:5vh;font-size:18px;opacity:.85}
.tbar{position:relative;width:min(80vw,320px);height:6px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:12px}
.tfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;background:var(--tac);opacity:.75;transition:width 1s}
.tline{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--tfg);opacity:.6}
.tbar.glow{animation:tglow 2.4s ease-out}
@keyframes tglow{0%{box-shadow:0 0 0 0 var(--tac)}20%{box-shadow:0 0 22px 6px var(--tac)}100%{box-shadow:0 0 0 0 transparent}}
.alive{display:flex;align-items:center;gap:8px;margin-top:5vh;font-size:14px;opacity:.55}
.alive .dot{width:9px;height:9px;border-radius:50%;background:var(--tac);animation:breathe 3.9s ease-in-out infinite}
@keyframes breathe{0%{opacity:.25}41%{opacity:1}100%{opacity:.25}}
.tbox{margin-top:10px;font-size:14px;opacity:.55}
.hold{position:relative;margin-top:auto;margin-bottom:6px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--tfg);opacity:.8}
.hold svg{width:64px;height:64px}
.hold .ringbg{stroke:rgba(255,255,255,.18)}
.hold .ringfg{stroke:var(--tfg);transition:none}
.hold span{font-size:14px}
.hold.holding{opacity:1}
.spd{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;font-size:12px;opacity:.5}
#timer.gold .dg{background:linear-gradient(100deg,#e0a100 20%,#fff1b8 45%,#e0a100 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s linear infinite}
#timer.gold .dg.roll{animation:roll .5s cubic-bezier(.2,.8,.3,1),sheen 7s linear infinite}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}
/* 結果発表 */
#result{align-items:stretch;background:radial-gradient(120% 70% at 50% 18%,#151b2b 0%,#0b0d12 60%)}
.edge{position:fixed;inset:0;pointer-events:none;opacity:0;border-radius:0}
.rwrap{display:flex;flex-direction:column;gap:12px;padding-bottom:10px;min-height:100%}
.rdemo{align-self:center;font-size:13px;color:#ffcf70;border:1px solid #6b5520;border-radius:10px;padding:2px 10px}
.rttl{text-align:center;font-size:15px;color:var(--dim);margin-top:4px}
.rcard{position:relative;z-index:1;transition:box-shadow .4s;align-self:center;min-width:72%;padding:14px 22px 12px;border-radius:22px;background:#121726;border:1px solid #273049;text-align:center}
.rnum b{font-size:60px}.rnum i{font-size:20px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:32px}
.chip{font-size:14px;padding:4px 11px;border-radius:999px;background:#1a2133;border:1px solid #2a3450;white-space:nowrap}
.chip.hot{border-color:var(--blue);color:#cfe4ff}
.chip.xp{border-color:#35507f}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.brow{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px}
.bl{font-size:14px;color:var(--dim)}
.bt{position:relative;height:12px;border-radius:7px;background:#1b2131}
.bf{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:7px;background:#7b8599}
.bk{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1px;border-radius:2px;background:#fff}
.bk.dash{background:none;border-left:2px dashed #9aa6bd;width:0}
.bk.dash::after{content:"平均";position:absolute;top:-17px;left:-12px;font-size:10px;color:#9aa6bd;white-space:nowrap}
.br{font-size:14px;color:var(--dim);text-align:right;white-space:nowrap;min-width:92px}
.brow.t1 .bf{background:var(--blue)}.brow.t2 .bf{background:var(--purple)}.brow.t3 .bf{background:var(--gold)}
.brow.t1 .br{color:var(--blue);font-weight:700}.brow.t2 .br{color:var(--purple);font-weight:700}.brow.t3 .br{color:var(--gold);font-weight:700}
.brow.off{opacity:.45}
.sec{opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}
.sec.on{opacity:1;transform:none}
.lvline{display:flex;align-items:center;gap:10px}
.lvn{min-width:64px;font-size:15px;font-weight:700}
.lvline .lvtrack{flex:1;height:12px}
.lvmsg{text-align:center;font-size:15px;color:#9cc2ff;min-height:24px;margin-top:4px}
.boxrow{display:flex;justify-content:center;gap:10px;min-height:50px;flex-wrap:wrap}
.mini{width:46px;height:40px;border-radius:9px;position:relative}
.mini::before{content:"";position:absolute;left:0;right:0;top:15px;height:3px;background:rgba(0,0,0,.35)}
.boxmsg{text-align:center;font-size:15px;color:var(--dim);margin:6px 0 8px}
#rNext{display:flex;flex-direction:column;gap:4px;text-align:center;font-size:16px}
#rNext .win{color:var(--gold)}
.rbtns{display:flex;gap:10px;margin-top:auto}
.stamp{position:fixed;left:50%;top:52%;z-index:5;transform:translate(-50%,-50%);font-size:44px;font-weight:900;letter-spacing:.04em;white-space:nowrap;pointer-events:none;opacity:0;-webkit-text-stroke:2px rgba(0,0,0,.35);text-shadow:0 0 24px currentColor}
.stamp.rb{background:linear-gradient(90deg,#ff5f6d,#ffc371,#fff36b,#5ef08a,#5ec8ff,#b07cff,#ff5f6d);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;text-shadow:none;filter:drop-shadow(0 0 14px #ffc93c);animation:sheen 1.6s linear infinite}
.tapnote{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;color:#5b6479;pointer-events:none}
/* 宝箱 */
#box{align-items:center;background:radial-gradient(100% 60% at 50% 45%,#161c2c,#0b0d12 70%)}
.xtop{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--dim)}
.shard{display:flex;align-items:center;gap:6px;color:#cfe4ff}
.shard i{width:14px;height:14px;transform:rotate(45deg);background:linear-gradient(135deg,#bfe3ff,#4da3ff);display:block;border-radius:2px}
.shard b{font-size:20px;color:#fff}
.xarea{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:320px}
.rays{position:absolute;width:560px;height:560px;left:50%;top:50%;margin:-280px 0 0 -280px;opacity:0;pointer-events:none;background:repeating-conic-gradient(from 0deg,var(--rc,#fff) 0deg 7deg,transparent 7deg 22deg);-webkit-mask:radial-gradient(circle,#000 0 18%,transparent 62%);mask:radial-gradient(circle,#000 0 18%,transparent 62%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chest{position:relative;width:200px;height:160px;cursor:pointer}
.chest .lid,.chest .body{position:absolute;left:0;right:0;border:3px solid rgba(0,0,0,.35)}
.chest .lid{top:0;height:58px;border-radius:22px 22px 6px 6px;background:var(--b1)}
.chest .body{top:52px;bottom:0;border-radius:6px 6px 18px 18px;background:var(--b2)}
.chest .band{position:absolute;top:0;bottom:0;width:18px;background:var(--bd);opacity:.9}
.chest .band.l{left:28px}.chest .band.r{right:28px}
.chest .lock{position:absolute;left:50%;top:40px;width:34px;height:40px;margin-left:-17px;border-radius:8px;background:var(--bd);border:3px solid rgba(0,0,0,.35);z-index:2}
.chest .lock::after{content:"";position:absolute;left:50%;top:12px;width:8px;height:12px;margin-left:-4px;border-radius:4px;background:rgba(0,0,0,.45)}
.chest.t0{--b1:repeating-linear-gradient(90deg,#a8743d 0 38px,#996a37 38px 40px);--b2:repeating-linear-gradient(90deg,#8c5b2c 0 38px,#7c5026 38px 40px);--bd:#4a3622}
.chest.t1{--b1:linear-gradient(#6aa4ff,#2f6be0);--b2:linear-gradient(#3e7cf0,#2152b8);--bd:#cfe0ff}
.chest.t2{--b1:linear-gradient(#b58aff,#7238e0);--b2:linear-gradient(#8b55f0,#5a26b8);--bd:#efe4ff}
.chest.t3{--b1:linear-gradient(#ffe37a,#e4a800);--b2:linear-gradient(#f2c230,#c48a00);--bd:#fff6cf}
.chest.t3::after{content:"";position:absolute;inset:0;border-radius:20px;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);background-size:250% 100%;animation:sheen 2.6s linear infinite;pointer-events:none}
.cracks{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}
.cracks polyline{fill:none;stroke:#fff;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.cglow{position:absolute;inset:10px;border-radius:20px;z-index:1;opacity:0;pointer-events:none;transition:opacity .25s}
.xhint{position:absolute;bottom:8%;left:0;right:0;text-align:center;color:var(--dim);font-size:16px}
.card{position:absolute;width:min(78vw,300px);padding:18px 18px 16px;border-radius:22px;background:#141a28;border:2px solid var(--rc);box-shadow:0 0 44px color-mix(in srgb,var(--rc) 45%,transparent);text-align:center;display:none;overflow:hidden}
.card.on{display:block}
.card .cr{display:inline-block;font-size:13px;font-weight:700;color:#0b0d12;background:var(--rc);border-radius:8px;padding:1px 10px}
.card .cn{font-size:26px;font-weight:800;margin:8px 0 2px}
.card .ct{font-size:14px;color:var(--dim)}
.card .cs{font-size:15px;margin-top:8px;min-height:24px}
.card .cf{font-size:12px;color:#6c7690;margin-top:4px}
.card .cpv{margin:12px auto 0;display:flex;justify-content:center}
.card.ed::after,.tile.ed::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 25%,rgba(255,120,220,.22) 38%,rgba(120,220,255,.25) 50%,rgba(255,255,140,.22) 62%,transparent 75%);background-size:260% 100%;animation:sheen 2.2s linear infinite;pointer-events:none;mix-blend-mode:screen}
.promo{position:absolute;top:18%;left:0;right:0;text-align:center;font-size:34px;font-weight:900;color:var(--gold);text-shadow:0 0 20px var(--gold);opacity:0;pointer-events:none}
.xbtns{width:100%;display:flex;gap:10px}
.xbtns .start{flex:2}.xbtns .ghost{flex:1}
.sumgrid{position:absolute;inset:0;display:none;flex-wrap:wrap;align-content:center;justify-content:center;gap:10px;padding:10px}
.sumgrid.on{display:flex}
/* 見本の絵 */
.pv{width:96px;height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:300;font-size:26px;border:1px solid rgba(255,255,255,.1)}
.pvf{width:56px;height:72px;border:0;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 50% 72%,var(--f0) 0 18%,var(--f1) 45%,var(--f2) 78%,transparent 80%);filter:drop-shadow(0 0 10px var(--f1));animation:flick 1.2s ease-in-out infinite alternate}
.pvf[data-rb]{--f0:#fff;--f1:#ff5fb0;--f2:#5ec8ff;animation:flick 1.2s ease-in-out infinite alternate,hue 3s linear infinite}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.94,1.06)}}
@keyframes hue{to{filter:hue-rotate(360deg) drop-shadow(0 0 10px #f0f)}}
.pvs{font-size:28px;color:#cfe4ff;background:#1a2235}
.goldtx{background:linear-gradient(100deg,#e0a100 20%,#fff1b8 45%,#e0a100 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s linear infinite}
/* 図鑑 */
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.hdr h2{font-size:22px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;min-height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px}
.tabs button.on{border-color:var(--blue);color:#cfe4ff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;overflow:hidden;border-radius:16px;background:var(--card);border:2px solid var(--line);padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px}
.tile .tn{font-size:14px;font-weight:700;text-align:center;line-height:1.3}
.tile .tr{font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;color:#0b0d12}
.tile.lock{opacity:.38;filter:grayscale(.5)}
.tile.lock .price{font-size:12px;color:#cfe4ff}
.tile.eq{border-color:var(--green)}
.tile .eqm{position:absolute;top:6px;right:8px;font-size:11px;color:var(--green);font-weight:700}
.prog{font-size:14px;color:var(--dim);margin:2px 0 10px}
/* 試し */
.lab h3{font-size:16px;margin:18px 0 8px}
.lab .note{font-size:14px;color:var(--dim);line-height:1.7}
.lab .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lab .btns button{min-height:48px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:15px}
.lab label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0;font-size:15px}
.lab input{width:110px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:#0f131d;color:var(--fg);font:inherit;padding:0 10px;text-align:right;-webkit-user-select:text;user-select:text}
/* 共通 */
#flameCv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:49;background:#fff}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#232b3d;color:#fff;font-size:15px;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#hapl{position:fixed;left:0;top:0;width:1px;height:1px;opacity:.01;overflow:hidden;pointer-events:none}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:40}
.sheet.on{display:flex}
.sheet .in{width:100%;background:#161b28;border-radius:20px 20px 0 0;padding:16px 18px max(18px,env(safe-area-inset-bottom))}
.sheet .in button{display:block;width:100%;min-height:50px;text-align:left;border-bottom:1px solid var(--line);font-size:17px}
.sheet .in button.cur{color:var(--blue);font-weight:700}
@media (prefers-reduced-motion: reduce){.dg.roll{animation:fadein .3s}.rays{animation:none}.pvf{animation:none}@keyframes fadein{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>

<section id="home" class="scr on">
  <div class="lvbar">
    <div class="lvbadge"><b id="hLv">1</b><small>レベル</small></div>
    <div class="lvcol"><div class="lvtrack"><div class="lvfill" id="hLvFill"></div></div><div class="lvnext" id="hLvNext"></div></div>
  </div>
  <div class="today">
    <div class="tlabel">今日</div>
    <div class="bignum" id="hToday"></div>
    <div class="tgoal" id="hGoal"></div>
    <div class="dbar" id="hBar"><div class="dfill" id="hDFill"></div><div class="dline" id="hDLine"></div></div>
    <div class="week" id="hWeek"></div>
    <div class="streak" id="hStreak"></div>
  </div>
  <div class="row2">
    <button class="pill grow" id="hBox">宝箱 0</button>
    <button class="pill grow" id="hDex">図鑑</button>
    <button class="pill grow" id="hLab">試し</button>
  </div>
  <div class="startwrap">
    <button class="subj" id="hSubj"></button>
    <button class="start" id="hStart">勉強を始める</button>
    <div class="foot"><button id="hSound"></button></div>
  </div>
</section>

<section id="timer" class="scr">
  <div class="spd" id="tSpd" hidden></div>
  <div class="tsubj" id="tSubj"></div>
  <div class="clock" id="tClock"></div>
  <div class="tcap" id="tSess"></div>
  <div class="tdiff" id="tDiff"></div>
  <div class="tbar" id="tBar"><div class="tfill" id="tFill"></div><div class="tline" id="tLine"></div></div>
  <div class="alive"><i class="dot"></i><span>数えています</span></div>
  <div class="tbox" id="tBox"></div>
  <button class="hold" id="tEnd" aria-label="長押しで終わる">

 const today=dDate(ms),tk=kOf(today),nk=kOf(addD(today,1)),yk=kOf(addD(today,-1));

 // 3 週・月
 FAST=false;let quiet=false;
 for(const [row,key,t,lab] of [[$('#bWeek'),'week',2,'先週超え'],[$('#bMonth'),'month',3,'先月超え']]){
  const tg=key==='week'?D.tg.lastW:D.tg.lastM,cr=D.cr[key];
  if(tg==null){barSet(row,D.after[key],300);quiet=true;continue;}
  if(cr){await countRow(row,D.before[key],D.after[key],tg,null,4,150,null,t,lab);}
  else{barSet(row,D.after[key],300);row.querySelector('.br').textContent=`あと ${fmS(tg-D.after[key]+1)}`;quiet=true;}
 }
 if(quiet)await wait(320);
 if(triple){
  FAST=false;await wait(200);const p=center($('#rCard'));
  flash('#fff4c2',0.85,420);shake($('.rwrap'),10,700);burst(p.x,p.y,RM?0:320,['#ffc93c','#ff5fb0','#5ec8ff','#5ef08a','#ffffff'],{sp:640,conf:true,ring:260});
  SND.hero();hap(3,120);setTimeout(()=>hap(1),520);
  const st=$('#rStamp');st.className='stamp rb';st.textContent='トリプル更新';
  st.animate(RM?[{opacity:0},{opacity:1,offset:.2},{opacity:1,offset:.8},{opacity:0}]:[{opacity:0,transform:'translate(-50%,-50%) scale(3)'},{opacity:1,transform:'translate(-50%,-50%) scale(1)',offset:.15},{opacity:1,transform:'translate(-50%,-50%) scale(1.06)',offset:.8},{opacity:0,transform:'translate(-50%,-50%) scale(1.1)'}],{duration:FAST?600:1800,easing:'ease-out'});
  flameSet(4);await wait(1500);
 }
 if(top===0){SND.soft();hap(1);}
 // 4 レベル
 FAST=false;$('#rLvSec').classList.add('on');
 let lv=lvOf(D.xp0);$('#rLv').textContent=`レベル ${lv.L}`;$('#rLvFill').style.transition='none';$('#rLvFill').style.width=(lv.rest/lv.need*100)+'%';
 for(const [t,x] of D.reasons){chip($('#rWhy'),`${t} +${x}`,'xp');SND.coin();await wait(140);}
 const lsteps=top?8:5;
 for(let i=1;i<=lsteps;i++){const xp=Math.round(D.xp0+(D.xp1-D.xp0)*i/lsteps);const nl=lvOf(xp);
  if(nl.L>lv.L){$('#rLvFill').style.transition='none';$('#rLvFill').style.width='100%';$('#rLv').textContent=`レベル ${nl.L}`;pop($('#rLv'),1.5,380);const p=center($('#rLv'));burst(p.x,p.y,50,['#7fb3ff','#ffffff']);SND.lvup();hap(2,90);$('#rLvMsg').textContent=`レベル ${nl.L} に上がった`;await wait(450);}
  lv=nl;$('#rLvFill').style.transition=FAST?'none':'width 90ms linear';$('#rLvFill').style.width=(nl.rest/nl.need*100)+'%';await wait(90);}
 if(!$('#rLvMsg').textContent)$('#rLvMsg').textContent=`次のレベルまで あと ${fm(lv.need-lv.rest)}`;
 // 5 宝箱
 FAST=false;$('#rBoxSec').classList.add('on');
 for(const bx of D.boxes){const e=document.createElement('div');e.className='mini';e.style.background=BOX_C[bx.t];e.title=BOX_N[bx.t];$('#rBoxes').appendChild(e);pop(e,1.4,300);SND.tick(bx.t*3);await wait(160);}
 const total=S.boxes.length;
 $('#rBoxMsg').innerHTML=D.boxes.length?`${D.boxes.map(b=>BOX_N[b.t]).join('・')} を手に入れた${total>D.boxes.length?`<br>未開封は全部で ${total}`:''}`:(total?`未開封の宝箱 ${total}`:`次の木箱まで タイマー あと ${fm(60-S.timerCarry)}`);
 // 6 次
 $('#rNextSec').classList.add('on');
 const L=[];
 if(top===0){L.push(`<span class="win">連続 ${D.streak}日 ・ 今週 ${fm(D.after.week)}</span>`);if(D.tg.yest!=null&&D.after.day<=D.tg.yest)L.push(`今日中なら 昨日まで あと <b>${fm(D.tg.yest-D.after.day+1)}</b>`);}
 L.push(`明日は <b>${fm(D.after.day+1)}</b> で今日を超える`);
 if(D.tg.lastW!=null&&!D.cr.week&&D.after.week<=D.tg.lastW)L.push(`先週超えまで あと <b>${fm(D.tg.lastW-D.after.week+1)}</b>（締め切りまで ${D.st.wLeft}日）`);
 if(D.tg.lastM!=null&&!D.cr.month&&D.after.month<=D.tg.lastM)L.push(`先月超えまで あと <b>${fm(D.tg.lastM-D.after.month+1)}</b>（あと ${D.st.mLeft}日）`);
 $('#rNext').innerHTML=L.map(x=>`<div>${x}</div>`).join('');
 $('#rOpen').style.display=total?'':'none';$('#rOpen').textContent=`割る（${total}）`;
 $('#rBtns').classList.add('on');$('#rTap').style.display='none';RES=false;FAST=false;
}
$('#rHome').onclick=()=>{flameSet(0);show('home');};
$('#rOpen').onclick=()=>{flameSet(0);openBoxes();};

// ---------- 宝箱を叩いて割る ----------
const BX={b:null,hits:0,need:3,item:null,ed:0,fake:false,broken:false};
let shardShow=0;
function rollItem(t){const w=DROP[t];let x=Math.random()*100,r=0;if(x<w[0])r=0;else if(x<w[0]+w[1])r=1;else r=2;const pool=ITEMS.filter(i=>i.r===r);return{item:pool[Math.random()*pool.length|0],ed:Math.random()<0.05?1:0};}
function updShard(){$('#xShard').textContent=shardShow;}
function openBoxes(){if(!S.boxes.length){show('home');return;}show('box');shardShow=S.shards;updShard();$('#xSum').classList.remove('on');$('#xSum').innerHTML='';loadBox();}
function loadBox(){
 const b=S.boxes[0];if(!b){show('home');return;}
 const ri=rollItem(b.t);Object.assign(BX,{b,hits:0,need:BOX_HITS[b.t],item:ri.item,ed:ri.ed,fake:ri.item.r===2&&Math.random()<0.3,broken:false});
 const ch=$('#xChest');ch.className='chest t'+b.t;ch.style.display='';ch.style.opacity=1;ch.style.transform='';$('#xCracks').innerHTML='';$('#xGlow').style.opacity=0;
 $('#xRays').style.opacity=0;$('#xCard').className='card';$('#xHint').textContent=`${BOX_N[b.t]}を叩いて割る（${BX.need}回）`;$('#xHint').style.display='';
 $('#xLeft').textContent=`残り ${S.boxes.length}箱`;$('#xNext').hidden=true;$('#xAll').style.display=S.boxes.length>1?'':'none';
 ch.animate(RM?[{opacity:0},{opacity:1}]:[{transform:'translateY(-40px) scale(.8)',opacity:0},{transform:'none',opacity:1}],{duration:380,easing:'cubic-bezier(.2,1.3,.4,1)'});
}
function addCrack(h){const cx=100+(Math.random()-.5)*40,cy=95+(Math.random()-.5)*30;const ang=Math.random()*Math.PI*2;let pts=[[cx,cy]];for(let j=0;j<2;j++){const a0=ang+j*Math.PI+(Math.random()-.5)*0.8;let x=cx,y=cy;for(let s=0;s<4+h;s++){const a=a0+(Math.random()-.5)*1.1;x+=Math.cos(a)*(12+Math.random()*10);y+=Math.sin(a)*(10+Math.random()*8);pts.push([x,y]);}const pl=document.createElementNS('http://www.w3.org/2000/svg','polyline');pl.setAttribute('points',pts.map(p=>p.join(',')).join(' '));$('#xCracks').appendChild(pl);pts=[[cx,cy]];}}
function shardFly(from,k){const tgt=center($('#xShard'));for(let i=0;i<k;i++){const a=-Math.PI/2+(Math.random()-.5)*2.2,sp=260+Math.random()*260;PS.push({k:'coin',x:from.x,y:from.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:500,drag:1,s:5,life:3,age:0,c:'#7fc4ff',keep:true,home:tgt,homeAt:0.32+Math.random()*0.15,onHome:()=>{shardShow=Math.min(S.shards,shardShow+1);updShard();SND.coin();pop($('#xShard'),1.3,150);}});}pstart();}
$('#xChest').addEventListener('pointerdown',e=>{e.preventDefault();if(BX.broken||!BX.b)return;ac();BX.hits++;const h=BX.hits;
 if(h>=BX.need){breakBox();return;}
 SND.hit(h);hap(1);addCrack(h);$('#xHint').style.display='none';
 const ch=$('#xChest'),p=center(ch);
 ch.animate(RM?[{opacity:.6},{opacity:1}]:[{transform:'scale(.9,.86)'},{transform:'scale(1.06,1.04)',offset:.5},{transform:'scale(1)'}],{duration:220,easing:'cubic-bezier(.2,.8,.3,1)'});
 shake($('#xArea'),4+h*1.5,220);
 const k=1+(Math.random()*2|0)+(BX.b.t>=2?1:0);S.shards+=k;save();shardFly(p,k);
 if(h===BX.need-1){const c=BX.fake?RAR_C[1]:RAR_C[BX.item.r];const g=$('#xGlow');g.style.background=`radial-gradient(circle,${c} 0%,transparent 70%)`;g.style.opacity=.85;$$('#xCracks polyline').forEach(pl=>{pl.style.stroke=c;});$('#xCracks').style.filter=`drop-shadow(0 0 6px ${c}) drop-shadow(0 0 14px ${c})`;
  if(BX.fake||BX.item.r>=1)burst(p.x,p.y,BX.item.r>=1?24:0,[c,'#ffffff'],{sp:240,ring:70});}
 else $('#xCracks').style.filter='drop-shadow(0 0 3px #fff)';
});
async function breakBox(){
 BX.broken=true;const it=BX.item,r=it.r,ch=$('#xChest'),p=center(ch);$('#xHint').style.display='none';
 if(BX.fake){flash(RAR_C[1],.5,220);SND.hit(5);shake($('#xArea'),8,300);burst(p.x,p.y,50,[RAR_C[1],'#ffffff']);await new Promise(res=>setTimeout(res,480));SND.promote();const pr=$('#xPromo');pr.animate([{opacity:0,transform:'scale(2)'},{opacity:1,transform:'scale(1)',offset:.2},{opacity:1,offset:.8},{opacity:0}],{duration:1300,easing:'ease-out'});}
 const c=RAR_C[r];flash(r===2?'#ffe9a8':'#ffffff',[.4,.6,.85][r],[200,260,360][r]);SND.brk(r);hap(r+1,110);shake($('#xArea'),[6,9,13][r],[250,330,450][r]);
 ch.animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.25)',opacity:0}],{duration:170,fill:'forwards'});setTimeout(()=>{ch.style.display='none';},170);
 if(!RM)for(let i=0;i<26;i++){const a=Math.random()*Math.PI*2,sp=200+Math.random()*420;PS.push({k:'deb',x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-150,g:900,drag:0.6,s:8+Math.random()*12,rot:Math.random()*6,vr:(Math.random()-.5)*16,life:1.1,age:0,c:BOX_C[BX.b.t]});}
 burst(p.x,p.y,[40,90,180][r],[c,'#ffffff',r===2?'#fff2b0':c],{sp:[380,480,620][r],conf:r===2,ring:[110,150,220][r]});
 const ry=$('#xRays');ry.style.setProperty('--rc',c+'55');ry.animate([{opacity:0,transform:'scale(.4)'},{opacity:[.35,.55,.85][r],transform:'scale(1)'}],{duration:500,fill:'forwards',easing:'ease-out'});
 // 持ち物に入れる
 const own=S.owned[it.id];let status='',isNew=false;
 if(!own){S.owned[it.id]={ed:BX.ed,from:BX.b.from};isNew=true;status='<b style="color:var(--green)">NEW</b>';}
 else if(BX.ed&&!own.ed){own.ed=1;own.from=BX.b.from;isNew=true;status='<b style="color:#ff9ad5">光る版 NEW</b>';}
 else{S.shards+=DUP[r];status=`かぶり → 欠片 +${DUP[r]}`;}
 S.boxes.shift();save();
 const card=$('#xCard');card.style.setProperty('--rc',c);card.className='card on'+((S.owned[it.id].ed)?' ed':'');
 card.innerHTML=`<span class="cr">${RAR_N[r]}${BX.ed?'・光る版':''}</span><div class="cn">${it.n}</div><div class="ct">${TYPE_N[it.t]}</div><div class="cpv">${pvHTML(it)}</div><div class="cs">${status}</div><div class="cf">${BX.b.from} の箱から</div>`+
  `<div style="margin-top:12px">${S.equip[it.t]===it.id?'<span class="ct">付けています</span>':`<button class="pill" id="xEquip">付けてみる</button>`}</div>`;
 card.animate(RM?[{opacity:0},{opacity:1}]:[{transform:'scale(.2) translateY(60px)',opacity:0},{transform:'scale(1.08)',opacity:1,offset:.6},{transform:'scale(1)',opacity:1}],{duration:460,easing:'cubic-bezier(.2,.8,.3,1)'});
 if(!isNew)setTimeout(()=>shardFly(center(card),Math.min(12,DUP[r]/2|0)),500);
 const eq=$('#xEquip');if(eq)eq.onclick=()=>{S.equip[it.t]=it.id;save();eq.outerHTML='<span class="ct">付けました</span>';if(it.t==='snd')previewSnd(it.id);else toast(it.t==='theme'?'次のタイマーからこの色になります':'次の結果発表からこの炎になります');};
 const pv=card.querySelector('.pvs');if(pv)pv.onclick=()=>previewSnd(it.id);
 $('#xLeft').textContent=`残り ${S.boxes.length}箱`;
 $('#xNext').hidden=!S.boxes.length;$('#xAll').style.display=S.boxes.length>1?'':'none';
}
$('#xNext').onclick=()=>{$('#xRays').getAnimations().forEach(a=>a.cancel());loadBox();};
$('#xDone').onclick=()=>{PS.length=0;show('home');};
$('#xAll').onclick=async()=>{
 const sum=$('#xSum');sum.innerHTML='';sum.classList.add('on');$('#xChest').style.display='none';$('#xCard').className='card';$('#xHint').style.display='none';$('#xRays').getAnimations().forEach(a=>a.cancel());$('#xRays').style.opacity=0;$('#xAll').style.display='none';$('#xNext').hidden=true;
 let i=0;while(S.boxes.length){const b=S.boxes.shift();const ri=rollItem(b.t),it=ri.item;const own=S.owned[it.id];let tag='NEW';if(!own)S.owned[it.id]={ed:ri.ed,from:b.from};else if(ri.ed&&!own.ed){own.ed=1;tag='光る版';}else{S.shards+=DUP[it.r];tag=`欠片+${DUP[it.r]}`;}
  save();const tl=document.createElement('div');tl.className='tile'+(ri.ed?' ed':'');tl.style.width='30%';tl.style.borderColor=RAR_C[it.r];tl.innerHTML=`${pvHTML(it)}<div class="tn">${it.n}</div><span class="tr" style="background:${RAR_C[it.r]}">${tag}</span>`;sum.appendChild(tl);pop(tl,1.3,260);SND.tick(i*2+it.r*4);if(it.r)hap(it.r);const p=center(tl);burst(p.x,p.y,[10,30,70][it.r],[RAR_C[it.r],'#fff'],{sp:260,ring:60});i++;$('#xLeft').textContent=`残り ${S.boxes.length}箱`;await new Promise(r=>setTimeout(r,it.r===2?700:360));}
 shardShow=S.shards;updShard();
};

// ---------- 見本の絵・音 ----------
function pvHTML(it){
 if(it.t==='theme')return `<div class="pv" style="background:${it.bg};color:${it.fg}"><span class="${it.gold?'goldtx':''}">42</span><small style="font-size:13px;margin-left:2px;opacity:.7">分</small></div>`;
 if(it.t==='flame')return `<div class="pv pvf" style="--f0:${it.c[0]};--f1:${it.c[1]};--f2:${it.c[2]}"${it.rainbow?' data-rb':''}></div>`;
 return `<div class="pv pvs">♪</div>`;
}
function previewSnd(id){if(!soundOn()){toast('音がオフです');return;}ac();for(let i=0;i<6;i++)setTimeout(()=>SND.tick(i*2,id),i*200);}

// ---------- 図鑑 ----------
let DT='theme';
$('#dTabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;DT=b.dataset.t;$$('#dTabs button').forEach(x=>x.classList.toggle('on',x===b));renderDex();};
function renderDex(){
 $('#dShard').textContent=S.shards;const list=ITEMS.filter(i=>i.t===DT);const have=list.filter(i=>S.owned[i.id]).length;
 $('#dProg').textContent=`${have} / ${list.length} 持っている・薄い物は欠片で取れます`;
 $('#dGrid').innerHTML=list.map(it=>{const o=S.owned[it.id],eq=S.equip[it.t]===it.id;
  return `<div class="tile${o?'':' lock'}${eq?' eq':''}${o&&o.ed?' ed':''}" data-id="${it.id}">${eq?'<span class="eqm">付けている</span>':''}${pvHTML(it)}<div class="tn">${it.n}</div><span class="tr" style="background:${RAR_C[it.r]}">${RAR_N[it.r]}</span>${o?`<div style="font-size:11px;color:#6c7690;text-align:center">${o.from}</div>`:`<div class="price">欠片 ${PRICE[it.r]}</div>`}</div>`;}).join('');
}
$('#dGrid').onclick=e=>{const t=e.target.closest('.tile');if(!t)return;const it=IT[t.dataset.id],o=S.owned[it.id];
 if(o){S.equip[it.t]=it.id;save();renderDex();if(it.t==='snd')previewSnd(it.id);else toast(`「${it.n}」を付けました`);return;}
 const pr=PRICE[it.r];if(S.shards<pr){toast(`欠片があと ${pr-S.shards} 足りません`);return;}
 if(confirm(`欠片 ${pr} で「${it.n}」を取りますか？`)){S.shards-=pr;S.owned[it.id]={ed:0,from:md(Date.now())+' 欠片で交換'};save();renderDex();toast(`「${it.n}」を取りました`);}
};
$('#dBack').onclick=()=>show('home');

// ---------- 試し ----------
function renderLab(){const B=S.base||{};$('#lY').value=B.y??'';$('#lW').value=B.w??'';$('#lM').value=B.m??'';
 const tot=S.sessions.reduce((a,s)=>a+s.m,0);$('#lInfo').textContent=`記録 ${S.sessions.length}回・合計 ${fm(tot)}・未開封の宝箱 ${S.boxes.length}・欠片 ${S.shards}`;}
$('#lBack').onclick=()=>show('home');
$('#lSave').onclick=()=>{const n=v=>{v=String(v).trim();return v===''?null:Math.max(0,parseInt(v,10)||0);};S.base={y:n($('#lY').value),w:n($('#lW').value),m:n($('#lM').value)};save();toast('目安を保存しました');};
$('#lReset').onclick=()=>{if(confirm('記録・宝箱・図鑑を全部消します。よろしいですか？')){localStorage.removeItem(KEY);location.reload();}};
$$('[data-demo]').forEach(b=>b.onclick=()=>{ac();demo(b.dataset.demo);});
function demo(kind){
 if(kind==='boxes'){S.boxes.push({t:0,from:'試し'},{t:1,from:'試し'},{t:3,from:'試し'});save();openBoxes();return;}
 const P={none:{m:22,b:[30,300,1500],t:[70,75,600,2400]},day:{m:52,b:[30,300,1500],t:[70,64,600,2400]},week:{m:55,b:[40,560,1500],t:[70,72,600,2400]},month:{m:60,b:[40,300,2370],t:[70,72,600,2400]},triple:{m:75,b:[45,560,2380],t:[90,80,620,2420]}}[kind];
 const a=P.b.map(v=>v+P.m),[y,av,lw,lm]=P.t;
 const cr={day:crossed(P.b[0],a[0],y)?'昨日':crossed(P.b[0],a[0],av)?'7日平均':null,week:crossed(P.b[1],a[1],lw),month:crossed(P.b[2],a[2],lm)};
 const reasons=[['勉強',P.m]];let bonus=0;const boxes=[];
 if(kind!=='none')boxes.push({t:0,from:'試し'});
 if(cr.day){reasons.push([cr.day+'超え',10]);bonus+=10;boxes.push({t:1,from:'試し'});}
 if(cr.week){reasons.push(['先週超え',30]);bonus+=30;boxes.push({t:2,from:'試し'});}
 if(cr.month){reasons.push(['先月超え',60]);bonus+=60;boxes.push({t:3,from:'試し'});}
 if(cr.day&&cr.week&&cr.month){reasons.push(['トリプル',50]);bonus+=50;}
 S.boxes.push(...boxes);save();const xp=totalXP();
 runResult({demo:true,m:P.m,subj:S.subj,first:false,before:{day:P.b[0],week:P.b[1],month:P.b[2]},after:{day:a[0],week:a[1],month:a[2]},tg:{yest:y,avg:av,lastW:lw,lastM:lm},cr,xp0:xp,xp1:xp+P.m+bonus,reasons,boxes,st:{wLeft:3,mLeft:12},streak:streakInfo().n});
}

// ---------- 起動 ----------
if(S.running)openTimer();else show('home');
</script>
