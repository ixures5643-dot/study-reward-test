<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0B1E">
<title>勉強タイマー 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ===== 決まり（DESIGN.md と同じ値） ===== */
:root{
 --bg0:#0A0B1E;--bg1:#121433;--bg2:#1A1D45;--bg3:#262A5E;
 --ink:#F4F5FF;--ink2:#B0B4DA;--ink3:#8A8FBC;
 --line:rgba(150,160,255,.14);
 --t0:#DDE3F0;--blue:#3D9BFF;--purple:#A66BFF;--gold:#FFC635;--green:#3DDC97;
 --fg:var(--ink);--dim:var(--ink2);--card:var(--bg2);
 --num:"Barlow Condensed","Hiragino Sans","Noto Sans JP",sans-serif;
 --jp:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg0);color:var(--ink);overflow:hidden}
body{font-family:var(--jp);font-size:17px;line-height:1.55;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
 background:radial-gradient(90% 45% at 0% 0%,rgba(70,90,255,.20),transparent 60%),radial-gradient(80% 45% at 100% 100%,rgba(170,70,255,.16),transparent 60%),var(--bg0)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
svg{display:block}
b{font-weight:800}
.n{font-family:var(--num);font-style:italic;font-weight:800;font-variant-numeric:tabular-nums}
.up{color:var(--green)!important}
.scr{position:fixed;inset:0;display:none;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scr.on{display:flex}

/* ===== 部品 ===== */
.panel{position:relative;background:linear-gradient(180deg,#1D2050 0%,#15173B 100%);border:1px solid var(--line);border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 28px rgba(0,0,0,.35)}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 18px;border-radius:18px;font-size:17px;font-weight:800;text-align:center;transition:transform .07s ease-out,box-shadow .07s ease-out}
.btn:active{transform:translateY(4px)}
.btn-fire{color:#fff;background:linear-gradient(180deg,#FF9A3D 0%,#FF5A2E 48%,#EE2F4E 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(150,10,40,.3),0 6px 0 #9E1430,0 14px 28px rgba(255,80,60,.32);text-shadow:0 2px 0 rgba(130,10,30,.5)}
.btn-fire:active{box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 2px 0 #9E1430,0 6px 14px rgba(255,80,60,.28)}
.btn-gold{color:#3B2300;background:linear-gradient(180deg,#FFF0A8 0%,#FFCF3F 45%,#F5A300 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(160,90,0,.28),0 6px 0 #A86400,0 14px 28px rgba(255,190,40,.28)}
.btn-gold:active{box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 2px 0 #A86400,0 6px 14px rgba(255,190,40,.22)}
.btn-ghost{color:var(--ink);background:linear-gradient(180deg,#282C64,#1D204C);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 5px 0 #0C0D26}
.btn-ghost:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 0 #0C0D26}
.btn-danger{color:#FF9AA8}
.ibtn{width:44px;height:44px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink2)}
.ibtn:active{transform:scale(.94)}
.ibtn svg{width:22px;height:22px}
.shard{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:#CFE4FF;background:rgba(61,155,255,.1);border:1px solid rgba(61,155,255,.35);min-height:34px;padding:0 12px 0 8px;border-radius:999px}
.shard svg{width:18px;height:18px}
.shard b{font-family:var(--num);font-style:italic;font-weight:800;font-size:21px;color:#fff;line-height:1}
.lvtrack{position:relative;height:12px;border-radius:8px;background:#0B0C24;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);overflow:hidden}
.lvfill{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#3B5BFF,#4FB0FF 70%,#8BE3FF);box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.lvhex{position:relative;flex:none;width:50px;height:56px;filter:drop-shadow(0 4px 10px rgba(60,90,255,.45))}
.lvhex svg{width:100%;height:100%}
.lvhex b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-style:italic;font-weight:900;font-size:27px;color:#fff;text-shadow:0 2px 0 rgba(10,20,90,.6);padding-top:1px}
.bignum{line-height:1;white-space:nowrap}
.bignum b{font-family:var(--num);font-style:italic;font-weight:900;letter-spacing:-.005em;padding-right:.04em}
.bignum i{font-style:normal;font-weight:800;color:var(--ink2);margin:0 6px 0 3px}

/* ===== ホーム ===== */
.hhead{display:flex;align-items:center;gap:12px;padding:2px 0 14px}
.lvcol{flex:1;min-width:0}
.lvtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px;white-space:nowrap}
.lvtop .k{font-weight:800;color:var(--ink);letter-spacing:.06em}
.lvtop b{font-family:var(--num);font-style:italic;font-size:17px;color:#9CC8FF}
.hero{padding:16px 20px 18px;margin-bottom:12px;overflow:hidden}
.hero::before{content:"";position:absolute;right:-70px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(61,155,255,.22),transparent 65%);pointer-events:none}
.hlabel{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:800;color:var(--ink2)}
.hdate{font-size:13px;font-weight:700;color:var(--ink3)}
#hToday{margin:8px 0 4px}
#hToday b{font-size:92px;background:linear-gradient(180deg,#FFFFFF 35%,#BFD0FF);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(5,6,30,.5))}
#hToday i{font-size:24px}
.dbar{position:relative;height:14px;border-radius:9px;background:#0B0C24;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);margin:30px 0 12px}
.dfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:9px;background:linear-gradient(90deg,#2F6BFF,#3D9BFF 60%,#7CC8FF);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 0 14px rgba(61,155,255,.45)}
.dline{position:absolute;top:-7px;bottom:-7px;width:3px;margin-left:-1.5px;border-radius:2px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.7)}
.dline span{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;color:var(--ink2);white-space:nowrap}
.dline.l span{left:-2px;transform:none}.dline.r span{left:auto;right:-2px;transform:none}
.tgoal{font-size:17px;font-weight:700}
.tgoal b{font-family:var(--num);font-style:italic;font-weight:800;font-size:25px;color:#7CC4FF;margin:0 2px}
.wk{padding:14px 16px 14px;margin-bottom:12px}
.wkhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;min-height:40px}
.streak{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:800;white-space:nowrap}
.streak svg{width:30px;height:37px;filter:drop-shadow(0 0 8px rgba(255,110,40,.55))}
.streak .n{font-size:36px;line-height:1;color:#FFB15C;margin:0 1px 0 2px}
.streak .z{font-size:15px;color:var(--ink2)}
.ticket{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.ticket svg{width:26px;height:18px}
.ticket b{font-family:var(--num);font-style:italic;font-size:19px;color:#7FF0C4}
.week{display:flex;justify-content:space-between}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--ink3)}
.wd i{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0E1030;border:2px solid #2A2E66}
.wd.fut i{background:none;border-style:dashed;border-color:#2A2E66}
.wd.done i{background:linear-gradient(180deg,#FFB03A,#FF5A2E);border-color:#FFC56B;box-shadow:0 0 12px rgba(255,120,40,.5),inset 0 2px 0 rgba(255,255,255,.35)}
.wd i svg{width:16px;height:16px}
.wd.now{color:var(--ink)}
.wd.now i{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.wd.done.now i{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.14),0 0 14px rgba(255,120,40,.6)}
.wkbar{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.wkt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.wkt b{font-family:var(--num);font-style:italic;font-weight:800;font-size:19px;color:#fff}
.wkt .k b{font-size:17px;color:#CDA6FF}
.wkt em{font-style:normal;color:#CDA6FF;font-weight:900}
.wkb{position:relative;height:8px;border-radius:6px;background:#0B0C24;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);margin-top:8px}
.wkb i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#6A2FE0,#A66BFF 70%,#D9BCFF);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.wkb u{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:#fff}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tl{display:flex;align-items:center;gap:10px;min-height:92px;padding:12px 12px 12px 10px;border-radius:22px;transition:transform .08s}
.tl:active{transform:scale(.97)}
.tl .art{width:60px;height:50px;flex:none}
.tl .art svg{width:100%;height:100%;overflow:visible}
.tl .art.dim{filter:grayscale(1) brightness(.75);opacity:.55}
.tl .tt{font-size:14px;font-weight:800;color:var(--ink2);line-height:1.2}
.tl .tv{font-size:30px;line-height:1.05}
.tl .tv small{font-size:16px;color:var(--ink3);margin-left:2px}
.tl .ts{font-size:12px;color:var(--ink3);font-weight:700;line-height:1.3;white-space:nowrap}
.tl.has{border-color:rgba(255,198,53,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 22px rgba(255,198,53,.2),0 12px 28px rgba(0,0,0,.35)}
.tl.has .ts{color:#FFD86B}
.tl.has .art{animation:bob 2.4s ease-in-out infinite}
.badge{position:absolute;top:-9px;right:-4px;background:linear-gradient(180deg,#FF6A3D,#E8304A);color:#fff;font-size:12px;font-weight:900;padding:2px 9px;border-radius:999px;box-shadow:0 3px 0 #8E1028}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.startwrap{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:12px}
.subj{align-self:center;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:16px;font-weight:800}
.subj:active{transform:scale(.96)}
.subj svg{width:18px;height:18px;color:var(--ink2)}
.subj .k{color:var(--ink3);font-size:13px;font-weight:700}
.start{min-height:68px;border-radius:22px;font-size:21px;font-weight:900;letter-spacing:.06em}
.start .pl{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.24);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.start .pl svg{width:14px;height:14px;margin-left:3px}

/* ===== タイマー中（静か） ===== */
#timer{--tfg:#EEF0FF;--tac:#3D9BFF;color:var(--tfg);align-items:center;transition:background .6s}
.tsubj{margin-top:max(2vh,6px);margin-bottom:12px;display:flex;align-items:center;gap:6px;min-height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.07);font-size:15px;font-weight:800;opacity:.8}
.tsubj svg{width:16px;height:16px}
.ringwrap{position:relative;width:min(82vw,316px);aspect-ratio:1;margin-top:auto;flex:none}
.tring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tring .trk{fill:none;stroke:rgba(255,255,255,.07);stroke-width:14}
.tring .tfl{fill:none;stroke:var(--tac);stroke-width:14;stroke-linecap:round;opacity:.9;transition:stroke-dashoffset 1s ease-out}
.tring .tmk{stroke:var(--tfg);stroke-width:4;stroke-linecap:round;opacity:.85}
.ringwrap.noref .tfl,.ringwrap.noref .tmk{display:none}
.ringwrap.glow .tfl{animation:tglow 2.4s ease-out}
@keyframes tglow{0%{stroke-width:14;opacity:.9}18%{stroke-width:24;opacity:1}100%{stroke-width:14;opacity:.9}}
.tcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tlab{font-size:13px;font-weight:800;opacity:.55;letter-spacing:.14em}
.clock{font-family:var(--num);font-weight:700;line-height:1;white-space:nowrap;margin:2px 0 8px}
.clock .dg{display:inline-block;font-size:104px}
.clock i{font-family:var(--jp);font-style:normal;font-size:22px;opacity:.6;margin:0 6px 0 3px;font-weight:800}
.dg.roll{animation:roll .5s cubic-bezier(.2,.8,.3,1)}
@keyframes roll{from{transform:translateY(45%);opacity:0}to{transform:none;opacity:1}}
.tcap{font-size:14px;font-weight:700;opacity:.55}
.tdiff{margin-top:4vh;font-size:18px;font-weight:800;opacity:.92}
.tdiff b{font-family:var(--num);font-style:italic;font-weight:800;font-size:25px;color:var(--tac);margin:0 2px}
.alive{display:flex;align-items:center;gap:8px;margin-top:3vh;font-size:14px;font-weight:700;opacity:.55}
.alive .dot{width:9px;height:9px;border-radius:50%;background:var(--tac);animation:breathe 3.9s ease-in-out infinite}
@keyframes breathe{0%{opacity:.25}41%{opacity:1}100%{opacity:.25}}
.tboxw{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;font-weight:700;opacity:.6}
.tboxw .ic{width:26px;height:21px}
.tboxw .ic svg{width:100%;height:100%;overflow:visible}
.hold{position:relative;margin-top:auto;margin-bottom:2px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--tfg);opacity:.8}
.hold svg{width:76px;height:76px;transition:transform .15s}
.hold .ringbg{stroke:rgba(255,255,255,.16)}
.hold .ringfg{stroke:var(--tfg);transition:none}
.hold span{font-size:14px;font-weight:800}
.hold.holding{opacity:1}
.hold.holding svg{transform:scale(1.08)}
.spd{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;font-size:12px;opacity:.5}
#timer.gold .dg{background:linear-gradient(100deg,#e0a100 20%,#fff1b8 45%,#e0a100 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s linear infinite}
#timer.gold .dg.roll{animation:roll .5s cubic-bezier(.2,.8,.3,1),sheen 7s linear infinite}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}

/* ===== 結果発表（うるさい） ===== */
#result{align-items:stretch;background:radial-gradient(120% 55% at 50% 14%,#1F2460 0%,#0A0B1E 62%)}
.edge{position:fixed;inset:0;pointer-events:none;opacity:0}
.rwrap{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;padding-bottom:4px;min-height:100%}
.rdemo{align-self:center;font-size:12px;font-weight:800;color:#FFD27A;background:rgba(255,198,53,.1);border:1px solid rgba(255,198,53,.4);border-radius:999px;padding:3px 12px}
.rttl{text-align:center;font-size:13px;font-weight:900;color:var(--ink2);letter-spacing:.24em;margin-top:2px}
.rcard{position:relative;z-index:1;align-self:center;min-width:74%;padding:12px 22px 10px;border-radius:26px;background:linear-gradient(180deg,#262B68,#171A44);border:2px solid rgba(160,170,255,.22);text-align:center;transition:box-shadow .4s}
.rnum b{font-size:74px;color:#fff;text-shadow:0 4px 0 rgba(5,6,30,.55)}
.rnum i{font-size:22px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:32px}
.chip{font-size:14px;font-weight:800;padding:5px 12px;border-radius:999px;background:#1C1F4A;border:1px solid var(--line);white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.chip.hot{border-color:rgba(61,155,255,.7);color:#D6E8FF;background:rgba(61,155,255,.16)}
.chip.xp{color:#C6D3FF}
.bars{display:flex;flex-direction:column;gap:16px;padding:20px 16px 14px;border-radius:22px}
.brow{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px}
.bl{font-size:15px;font-weight:800;color:var(--ink2)}
.bt{position:relative;height:14px;border-radius:9px;background:#0B0C24;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.bf{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:9px;background:linear-gradient(90deg,#4A5088,#7C83B8);box-shadow:inset 0 2px 0 rgba(255,255,255,.22)}
.bk{position:absolute;top:-7px;bottom:-7px;width:3px;margin-left:-1.5px;border-radius:2px;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.6)}
.bk.dash{background:none;border-left:2px dashed #9AA6D0;width:0;margin-left:-1px;box-shadow:none}
.bk.dash::after{content:"平均";position:absolute;top:-19px;left:-12px;font-size:11px;font-weight:800;color:#9AA6D0;white-space:nowrap}
.br{font-size:15px;font-weight:800;color:var(--ink2);text-align:right;white-space:nowrap;min-width:94px}
.brow.t1 .bf{background:linear-gradient(90deg,#2F6BFF,#3D9BFF 60%,#8BD0FF);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 0 14px rgba(61,155,255,.6)}
.brow.t2 .bf{background:linear-gradient(90deg,#6A2FE0,#A66BFF 60%,#D9BCFF);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 0 14px rgba(166,107,255,.6)}
.brow.t3 .bf{background:linear-gradient(90deg,#E08A00,#FFC635 60%,#FFF0A0);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 0 16px rgba(255,198,53,.65)}
.brow.t1 .br{color:#7CC4FF}.brow.t2 .br{color:#CDA6FF}.brow.t3 .br{color:var(--gold)}
.brow.off{opacity:.45}
.sec{opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}
.sec.on{opacity:1;transform:none}
.rlv{padding:12px 16px 6px;border-radius:22px}
.lvline{display:flex;align-items:center;gap:12px}
.lvn{min-width:80px;font-size:16px;font-weight:900}
.lvline .lvtrack{flex:1;height:14px}
.lvmsg{text-align:center;font-size:15px;font-weight:800;color:#9CC2FF;min-height:24px;margin-top:4px}
.boxrow{display:flex;justify-content:center;gap:8px;min-height:46px;flex-wrap:wrap}
.boxrow:empty{display:none}
.mini{width:56px;height:45px;position:relative;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.mini svg{width:100%;height:100%;overflow:visible}
.boxmsg{text-align:center;font-size:15px;font-weight:700;color:var(--ink2);margin:4px 0 0}
#rNext{display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:700;padding:12px 16px;border-radius:22px;line-height:1.5}
#rNext>div{position:relative;padding-left:18px}
#rNext>div::before{content:"";position:absolute;left:1px;top:.62em;width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:var(--blue)}
#rNext b{font-family:var(--num);font-style:italic;font-weight:800;font-size:19px;color:#7CC4FF;margin:0 1px}
#rNext .win{color:var(--gold)}
.rbtns{position:sticky;bottom:0;z-index:3;display:flex;gap:10px;margin-top:auto;padding-top:14px;background:linear-gradient(rgba(10,11,30,0),#0A0B1E 45%)}
.rbtns .btn-ghost{flex:0 0 36%}
.rbtns .btn-gold{flex:1;font-size:19px;font-weight:900;min-height:56px}
.rbtns .btn-ghost{min-height:56px}
.stamp{position:fixed;left:50%;top:50%;z-index:5;transform:translate(-50%,-50%);font-family:var(--jp);font-size:44px;font-weight:900;letter-spacing:.06em;line-height:1.25;white-space:nowrap;pointer-events:none;opacity:0;padding:4px 22px 6px;border:5px solid currentColor;border-radius:18px;background:rgba(10,11,30,.78);text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 22px currentColor;box-shadow:0 0 34px color-mix(in srgb,currentColor 55%,transparent),inset 0 0 20px color-mix(in srgb,currentColor 35%,transparent)}
.stamp.rb{color:transparent!important;background:linear-gradient(90deg,#ff5f6d,#ffc371,#fff36b,#5ef08a,#5ec8ff,#b07cff,#ff5f6d);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;border-color:#FFC635;text-shadow:none;box-shadow:0 0 44px rgba(255,198,53,.65),inset 0 0 24px rgba(255,198,53,.35);animation:sheen 1.6s linear infinite}
.tapnote{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;font-weight:700;color:#5E6494;pointer-events:none}

/* ===== 宝箱 ===== */
#box{align-items:center;background:radial-gradient(90% 55% at 50% 45%,#242A72 0%,#0A0B1E 70%)}
.xtop{width:100%;display:flex;justify-content:space-between;align-items:center}
.xleft{font-size:14px;font-weight:800;color:var(--ink2);background:rgba(255,255,255,.06);border:1px solid var(--line);min-height:34px;display:flex;align-items:center;padding:0 14px;border-radius:999px}
.xarea{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:360px}
.rays{position:absolute;width:560px;height:560px;left:50%;top:50%;margin:-280px 0 0 -280px;opacity:0;pointer-events:none;background:repeating-conic-gradient(from 0deg,var(--rc,#fff) 0deg 7deg,transparent 7deg 22deg);-webkit-mask:radial-gradient(circle,#000 0 18%,transparent 62%);mask:radial-gradient(circle,#000 0 18%,transparent 62%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chest{position:relative;width:min(64vw,250px);aspect-ratio:200/160;cursor:pointer;z-index:2}
.chest::before{content:"";position:absolute;left:-30%;right:-30%;top:-40%;bottom:-40%;border-radius:50%;background:radial-gradient(closest-side,var(--halo,transparent),transparent);z-index:-1;pointer-events:none}
.chest::after{content:"";position:absolute;left:8%;right:8%;bottom:-9%;height:14%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);z-index:-1}
.chest.t1{--halo:rgba(61,155,255,.32)}.chest.t2{--halo:rgba(166,107,255,.36)}.chest.t3{--halo:rgba(255,198,53,.42)}
.chest .art{position:absolute;inset:0;animation:bob 2.6s ease-in-out infinite}
.chest .art svg{width:100%;height:100%;overflow:visible}
.cracks{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}
.cracks polyline{fill:none;stroke:#fff;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.cglow{position:absolute;inset:10%;border-radius:24px;z-index:2;opacity:0;pointer-events:none;transition:opacity .25s;mix-blend-mode:screen}
.pips{position:absolute;top:calc(50% + min(26vw,100px) + 22px);left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none}
.pips i{width:14px;height:14px;border-radius:50%;background:#0E1030;border:2px solid #3A408A}
.pips i.on{background:#fff;border-color:#fff;box-shadow:0 0 10px #fff}
.xhint{position:absolute;top:calc(50% + min(26vw,100px) + 50px);left:0;right:0;text-align:center;color:var(--ink2);font-size:16px;font-weight:800;pointer-events:none}
.card{position:absolute;z-index:4;width:min(80vw,310px);padding:22px 18px 18px;border-radius:26px;background:linear-gradient(180deg,#23275C,#14163A);border:2px solid var(--rc);box-shadow:0 0 0 4px rgba(0,0,0,.25),0 0 50px color-mix(in srgb,var(--rc) 50%,transparent),inset 0 1px 0 rgba(255,255,255,.12);text-align:center;display:none;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 45% at 50% 0%,color-mix(in srgb,var(--rc) 32%,transparent),transparent 70%);pointer-events:none}
.card.on{display:block}
.card>*{position:relative}
.card .cr{display:inline-block;font-size:13px;font-weight:900;color:#0A0B1E;background:var(--rc);border-radius:999px;padding:2px 14px;letter-spacing:.1em}
.card .cn{font-size:30px;font-weight:900;margin:10px 0 0;line-height:1.25}
.card .ct{font-size:14px;color:var(--ink2);font-weight:700}
.card .cpv{margin:14px auto 4px;display:flex;justify-content:center}
.card .cs{font-size:16px;margin-top:8px;min-height:24px;font-weight:800}
.card .cf{font-size:12px;color:var(--ink3);margin-top:2px;font-weight:700}
.card .cbtn{margin-top:14px;display:flex;justify-content:center}
.card .cbtn .btn{min-width:60%}
.card .pv{width:150px;height:96px;border-radius:18px}
.card .pv .pn{font-size:40px}
.card .pv .pvring{width:84px;height:84px}
.card .pvf svg{width:70px;height:88px}
.card .pvs svg{width:44px;height:44px}
.card.ed::after,.tile.ed::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 25%,rgba(255,120,220,.22) 38%,rgba(120,220,255,.25) 50%,rgba(255,255,140,.22) 62%,transparent 75%);background-size:260% 100%;animation:sheen 2.2s linear infinite;pointer-events:none;mix-blend-mode:screen}
.promo{position:absolute;top:16%;left:0;right:0;text-align:center;font-size:40px;font-weight:900;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 22px var(--gold);opacity:0;pointer-events:none;z-index:5}
.xbtns{width:100%;display:flex;gap:10px}
.xbtns .btn{flex:1;min-height:56px;padding:0 10px;white-space:nowrap}
.xbtns .btn-gold{flex:1.5;font-size:18px;font-weight:900}
.sumgrid{position:absolute;inset:0;display:none;flex-wrap:wrap;align-content:center;justify-content:center;gap:10px;padding:10px}
.sumgrid.on{display:flex}
.sumgrid .tile{min-height:0;padding-bottom:12px}

/* ===== 見本の絵 ===== */
.pv{position:relative;width:84px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.12);overflow:hidden;flex:none}
.pv .pvring{position:absolute;width:50px;height:50px;left:50%;top:50%;transform:translate(-50%,-50%)}
.pv .pn{position:relative;font-family:var(--num);font-weight:700;font-size:22px;line-height:1}
.pvf{border:0;background:none;overflow:visible}
.pvf svg{width:44px;height:56px;transform-origin:50% 100%;animation:flick 1.2s ease-in-out infinite alternate}
.pvf[data-rb] svg{animation:flick 1.2s ease-in-out infinite alternate,hue 3s linear infinite}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.94,1.06)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.pvs{background:radial-gradient(circle at 50% 35%,#2D3375,#171A44)}
.pvs svg{width:28px;height:28px}
.goldtx{background:linear-gradient(100deg,#e0a100 20%,#fff1b8 45%,#e0a100 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s linear infinite}

/* ===== 図鑑・設定 ===== */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex:none}
.hdr .ttl{display:flex;align-items:center;gap:10px}
.hdr h2{font-size:24px;font-weight:900;letter-spacing:.04em}
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:#0E1030;border:1px solid var(--line);margin-bottom:14px;flex:none}
.seg button{flex:1;min-height:44px;border-radius:12px;font-size:14px;font-weight:800;color:var(--ink2);text-align:center}
.seg button.on{background:linear-gradient(180deg,#30367C,#242962);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 3px 0 #090A22}
.prog{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:800;color:var(--ink2);margin:0 2px 14px;flex:none}
.prog .lvtrack{flex:1;height:10px}
.prog b{font-size:20px;color:#fff}
.prog .hint{font-size:12px;color:var(--ink3);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(180deg,#20245A,#15173B);border:2px solid color-mix(in srgb,var(--rc,#3A3F80) 55%,transparent);padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:160px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 14px rgba(0,0,0,.3);cursor:pointer}
.tile:active{transform:scale(.97)}
.tile .tn{font-size:14px;font-weight:800;text-align:center;line-height:1.3}
.tile .tr{font-size:11px;font-weight:900;border-radius:999px;padding:0 9px;color:#0A0B1E;background:var(--rc);letter-spacing:.05em}
.tile .from{font-size:11px;color:var(--ink3);text-align:center;line-height:1.35;font-weight:700}
.tile.lock{background:linear-gradient(180deg,#171A44,#111331);border-style:dashed}
.tile.lock .pv{opacity:.42;filter:saturate(.5)}
.tile.lock .tn{color:var(--ink2)}
.tile.lock .tr{opacity:.7}
.tile .lk{position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:50%;background:rgba(10,11,30,.8);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.tile .lk svg{width:13px;height:13px}
.tile .price{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:800;color:#AFDAFF}
.tile .price svg{width:14px;height:14px}
.tile.eq{border-color:var(--green);box-shadow:0 0 0 2px rgba(61,220,151,.22),0 0 18px rgba(61,220,151,.25)}
.tile .eqm{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;z-index:1}
.tile .eqm svg{width:13px;height:13px}
.lab h3{font-size:13px;font-weight:900;color:var(--ink3);letter-spacing:.12em;margin:22px 4px 8px}
.lab .note{font-size:14px;color:var(--ink2);line-height:1.7;margin:0 4px}
.group{padding:2px 16px;border-radius:20px}
.rowi{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;font-size:16px;font-weight:700;border-bottom:1px solid var(--line)}
.rowi:last-child{border-bottom:0}
.rowi small{display:block;font-size:12px;color:var(--ink3);font-weight:700;line-height:1.4}
.lab .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lab .btns .btn{font-size:15px;min-height:54px;padding:0 10px}
.lab input{width:110px;min-height:40px;border-radius:12px;border:1px solid var(--line);background:#0E1030;color:var(--ink);font:inherit;font-weight:800;padding:0 12px;text-align:right;-webkit-user-select:text;user-select:text}
.tog{width:54px;height:32px;flex:none;border-radius:999px;background:#2A2F66;position:relative;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.tog.on{background:var(--green)}.tog.on::after{transform:translateX(22px)}
.tog.off{opacity:.4}

/* ===== 共通 ===== */
#flameCv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:49;background:#fff}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(34,38,88,.97);border:1px solid var(--line);color:#fff;font-size:15px;font-weight:700;padding:11px 18px;border-radius:14px;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#toast.on{opacity:1}
#hapl{position:fixed;left:0;top:0;width:1px;height:1px;opacity:.01;overflow:hidden;pointer-events:none}
.sheet{position:fixed;inset:0;background:rgba(5,6,20,.6);display:none;align-items:flex-end;z-index:40;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet.on{display:flex}
.sheet .in{width:100%;background:linear-gradient(180deg,#23275C,#1A1D48);border-radius:26px 26px 0 0;padding:10px 20px max(18px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet .in::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 12px}
.sheet .sht{font-size:13px;font-weight:900;color:var(--ink3);letter-spacing:.12em;margin:0 0 4px}
.sheet .in button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;border-bottom:1px solid var(--line);font-size:17px;font-weight:800}
.sheet .in button:last-child{border-bottom:0;color:var(--ink2)}
.sheet .in button.cur{color:#8CCBFF}
.sheet .in button.cur::after{content:"✓";font-weight:900}
@media (prefers-reduced-motion: reduce){.dg.roll{animation:fadein .3s}.rays{animation:none}.pvf svg,.chest .art,.tl.has .art{animation:none}@keyframes fadein{from{opacity:0}to{opacity:1}}}
</style>

 const now=Date.now(),m=elMin(r,now);S.running=null;
 if(m<1){save();toast('1分未満は記録しません');show('home');return;}
 SND.end();hap(1);
 const st=stats(r.s),first=st.first&&st.yest==null&&st.lastW==null&&st.lastM==null,label=md(r.s);
 const b={day:st.todayM,week:st.weekM,month:st.monthM},a={day:b.day+m,week:b.week+m,month:b.month+m};
 const cr={day:crossed(b.day,a.day,st.yest)?'昨日':crossed(b.day,a.day,st.avg)?'7日平均':null,week:crossed(b.week,a.week,st.lastW),month:crossed(b.month,a.month,st.lastM)};
 const xp0=totalXP();
 S.sessions.push({s:r.s,e:now,m,d:st.tk,subj:r.subj,mode:'timer'});
 if(S.boxDay.k!==st.tk)S.boxDay={k:st.tk,n:0};
 const carry=S.timerCarry+m,nb=Math.min(Math.floor(carry/60),Math.max(0,6-S.boxDay.n));S.timerCarry=carry%60;S.boxDay.n+=nb;
 const boxes=[];for(let i=0;i<nb;i++)boxes.push({t:0,from:label+' タイマー'});
 const reasons=[['勉強',m]];let bonus=0;
 if(first){boxes.push({t:1,from:label+' 記録のはじまり'});reasons.push(['はじまり',10]);bonus+=10;}
 if(cr.day){boxes.push({t:1,from:label+' '+cr.day+'超え'});reasons.push([cr.day+'超え',10]);bonus+=10;}
 if(cr.week){boxes.push({t:2,from:label+' 先週超え'});reasons.push(['先週超え',30]);bonus+=30;}
 if(cr.month){boxes.push({t:3,from:label+' 先月超え'});reasons.push(['先月超え',60]);bonus+=60;}
 if(cr.day&&cr.week&&cr.month){reasons.push(['トリプル',50]);bonus+=50;}
 S.xpBonus+=bonus;S.boxes.push(...boxes);save();
 runResult({demo:false,m,subj:r.subj,first,before:b,after:a,tg:{yest:st.yest,avg:st.avg,lastW:st.lastW,lastM:st.lastM},cr,xp0,xp1:xp0+m+bonus,reasons,boxes,st:{wLeft:st.wLeft,mLeft:st.mLeft},streak:streakInfo().n});
}

async function countRow(row,from,to,target,target2,steps,stepMs,onNum,tier,label){

  if(crossAt!=null&&tier){const vc=crossAt+1;barSet(row,vc,0);onNum&&onNum(vc,i);SND.tick(i);hit=true;await crossFx(tier,label,row);}
  barSet(row,v,FAST?0:stepMs*0.9);onNum&&onNum(v,i);if(!FAST||i===steps)SND.tick(i);
  prev=v;await wait(stepMs);
 }
}

$('#xAll').onclick=async()=>{
 const sum=$('#xSum');sum.innerHTML='';sum.classList.add('on');$('#xChest').style.display='none';$('#xPips').style.visibility='hidden';$('#xCard').className='card';$('#xHint').style.display='none';$('#xRays').getAnimations().forEach(a=>a.cancel());$('#xRays').style.opacity=0;$('#xAll').style.display='none';$('#xNext').hidden=true;
 let i=0;while(S.boxes.length){const b=S.boxes.shift();const ri=rollItem(b.t),it=ri.item;const own=S.owned[it.id];let tag='NEW';if(!own)S.owned[it.id]={ed:ri.ed,from:b.from};else if(ri.ed&&!own.ed){own.ed=1;tag='光る版';}else{S.shards+=DUP[it.r];tag=`欠片+${DUP[it.r]}`;}
  save();const tl=document.createElement('div');tl.className='tile'+(ri.ed?' ed':'');tl.style.width='30%';tl.style.borderColor=RAR_C[it.r];tl.innerHTML=`${pvHTML(it)}<div class="tn">${it.n}</div><span class="tr" style="background:${RAR_C[it.r]}">${tag}</span>`;sum.appendChild(tl);pop(tl,1.3,260);SND.tick(i*2+it.r*4);if(it.r)hap(it.r);const p=center(tl);burst(p.x,p.y,[10,30,70][it.r],[RAR_C[it.r],'#fff'],{sp:260,ring:60});i++;$('#xLeft').textContent=`残り ${S.boxes.length}箱`;await new Promise(r=>setTimeout(r,it.r===2?700:360));}
 shardShow=S.shards;updShard();
};

// ---------- 見本の絵・音 ----------
function pvHTML(it){
 if(it.t==='theme')return `<div class="pv" style="background:${it.bg};color:${it.fg}"><svg class="pvring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="3"/><circle cx="20" cy="20" r="16" fill="none" stroke="${it.ac}" stroke-width="3" stroke-linecap="round" stroke-dasharray="70 101" transform="rotate(-90 20 20)"/></svg><span class="pn ${it.gold?'goldtx':''}">42</span></div>`;
 if(it.t==='flame'){const c=it.c,id='pf_'+it.id;return `<div class="pv pvf"${it.rainbow?' data-rb':''}><svg viewBox="0 0 48 60" aria-hidden="true"><defs><linearGradient id="${id}o" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[2]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient><linearGradient id="${id}i" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[0]}"/></linearGradient></defs><path d="${FL_O}" fill="url(#${id}o)" style="filter:drop-shadow(0 0 6px ${c[1]})"/><path d="${FL_I}" fill="url(#${id}i)"/></svg></div>`;}
 return `<div class="pv pvs" style="color:${RAR_C[it.r]}">${NOTE_SVG}</div>`;
}
function previewSnd(id){if(!soundOn()){toast('音がオフです');return;}ac();for(let i=0;i<6;i++)setTimeout(()=>SND.tick(i*2,id),i*200);}

// ---------- 図鑑 ----------
let DT='theme';
$('#dTabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;DT=b.dataset.t;$$('#dTabs button').forEach(x=>x.classList.toggle('on',x===b));renderDex();};
function renderDex(){
 $('#dShard').textContent=S.shards;const list=ITEMS.filter(i=>i.t===DT);const have=list.filter(i=>S.owned[i.id]).length;
 $('#dProg').innerHTML=`<span><b class="n">${have}</b> / ${list.length}</span><div class="lvtrack"><div class="lvfill" style="width:${have/list.length*100}%"></div></div><span class="hint">鍵の物は欠片で取れる</span>`;
 $('#dGrid').innerHTML=list.map(it=>{const o=S.owned[it.id],eq=S.equip[it.t]===it.id;
  return `<div class="tile${o?'':' lock'}${eq?' eq':''}${o&&o.ed?' ed':''}" data-id="${it.id}" style="--rc:${RAR_C[it.r]}">${eq?`<span class="eqm">${CHECK_SVG}</span>`:''}${o?'':`<span class="lk">${LOCK_SVG}</span>`}${pvHTML(it)}<div class="tn">${it.n}</div><span class="tr">${RAR_N[it.r]}</span>${o?`<div class="from">${eq?'付けている':o.from}</div>`:`<div class="price">${SHARD_SVG}${PRICE[it.r]}</div>`}</div>`;}).join('');
}
$('#dGrid').onclick=e=>{const t=e.target.closest('.tile');if(!t)return;const it=IT[t.dataset.id],o=S.owned[it.id];
 if(o){S.equip[it.t]=it.id;save();renderDex();if(it.t==='snd')previewSnd(it.id);else toast(`「${it.n}」を付けました`);return;}
 const pr=PRICE[it.r];if(S.shards<pr){toast(`欠片があと ${pr-S.shards} 足りません`);return;}
 if(confirm(`欠片 ${pr} で「${it.n}」を取りますか？`)){S.shards-=pr;S.owned[it.id]={ed:0,from:md(Date.now())+' 欠片で交換'};save();renderDex();toast(`「${it.n}」を取りました`);}
};
$('#dBack').onclick=()=>show('home');

// ---------- 試し ----------
function renderLab(){const B=S.base||{};const sw=$('#lSound');sw.classList.toggle('on',soundOn());sw.classList.toggle('off',MUTE);$('#lSoundNote').textContent=MUTE?'確認用の設定（?mute=1）で止めています':'消音スイッチを入れている時は鳴りません';$('#lY').value=B.y??'';$('#lW').value=B.w??'';$('#lM').value=B.m??'';
 const tot=S.sessions.reduce((a,s)=>a+s.m,0);$('#lInfo').textContent=`記録 ${S.sessions.length}回・合計 ${fm(tot)}・未開封の宝箱 ${S.boxes.length}・欠片 ${S.shards}`;}
$('#lBack').onclick=()=>show('home');
$('#lSave').onclick=()=>{const n=v=>{v=String(v).trim();return v===''?null:Math.max(0,parseInt(v,10)||0);};S.base={y:n($('#lY').value),w:n($('#lW').value),m:n($('#lM').value)};save();toast('目安を保存しました');};
$('#lReset').onclick=()=>{if(confirm('記録・宝箱・図鑑を全部消します。よろしいですか？')){localStorage.removeItem(KEY);location.reload();}};
$$('[data-demo]').forEach(b=>b.onclick=()=>{ac();demo(b.dataset.demo);});
function demo(kind){
 if(kind==='boxes'){S.boxes.push({t:0,from:'試し'},{t:1,from:'試し'},{t:3,from:'試し'});save();openBoxes();return;}
 const P={none:{m:22,b:[30,300,1500],t:[70,75,600,2400]},day:{m:52,b:[30,300,1500],t:[70,64,600,2400]},week:{m:55,b:[40,560,1500],t:[70,72,600,2400]},month:{m:60,b:[40,300,2370],t:[70,72,600,2400]},triple:{m:75,b:[45,560,2380],t:[90,80,620,2420]}}[kind];
 const a=P.b.map(v=>v+P.m),[y,av,lw,lm]=P.t;
 const cr={day:crossed(P.b[0],a[0],y)?'昨日':crossed(P.b[0],a[0],av)?'7日平均':null,week:crossed(P.b[1],a[1],lw),month:crossed(P.b[2],a[2],lm)};
 const reasons=[['勉強',P.m]];let bonus=0;const boxes=[];
 if(kind!=='none')boxes.push({t:0,from:'試し'});
 if(cr.day){reasons.push([cr.day+'超え',10]);bonus+=10;boxes.push({t:1,from:'試し'});}
 if(cr.week){reasons.push(['先週超え',30]);bonus+=30;boxes.push({t:2,from:'試し'});}
 if(cr.month){reasons.push(['先月超え',60]);bonus+=60;boxes.push({t:3,from:'試し'});}
 if(cr.day&&cr.week&&cr.month){reasons.push(['トリプル',50]);bonus+=50;}
 S.boxes.push(...boxes);save();const xp=totalXP();
 runResult({demo:true,m:P.m,subj:S.subj,first:false,before:{day:P.b[0],week:P.b[1],month:P.b[2]},after:{day:a[0],week:a[1],month:a[2]},tg:{yest:y,avg:av,lastW:lw,lastM:lm},cr,xp0:xp,xp1:xp+P.m+bonus,reasons,boxes,st:{wLeft:3,mLeft:12},streak:streakInfo().n});
}

// ---------- 起動 ----------
$('#tBoxArt').innerHTML=chestSVG(0);
if(S.running)openTimer();else show('home');
</script>
</body>
